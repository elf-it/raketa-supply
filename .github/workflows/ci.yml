# Проверка на каждый push в main и на каждый pull request (задачи A-5, A-8).
#
# Версии действий — крупные теги (`@v7`), а не коммиты: это действия самого
# GitHub, и крупный тег приносит их исправления сам. Для чужих действий так
# делать не стоит — там тег может переехать на чужой код, — но чужих здесь нет.
#
# Версии Node и Python намеренно те же, что в образах сборки
# (`node:24-alpine`, `python:3.11-slim`): иначе CI проверял бы не то, что
# собирается в прод. Node 24 — активный LTS до апреля 2028; на Node 22
# переходить не стали (задача A-9): он в режиме только исправлений
# и кончается 30 апреля 2027, то есть эту же работу пришлось бы делать
# ещё раз весной. Желаемая версия записана и в `frontend/.nvmrc`.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Бэкенд — линтер и тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    name: Фронтенд — типы и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # Метка «этот коммит проверен» (задача A-11). Ветка `ci-green` — не для
  # людей: это указатель на последний коммит main, прошедший обе проверки.
  #
  # Зачем он: сервер сам замечает правки и выкладывает только проверенное
  # (deploy/watch.sh). Раньше он спрашивал у публичного API GitHub состояние
  # проверок коммита — на приватном репозитории такой запрос требует токена,
  # то есть ещё одного секрета на машине и ещё одного срока его действия.
  # Указатель в самом репозитории читается тем же ключом, которым сервер
  # и так забирает код: `git ls-remote origin refs/heads/ci-green`. Ни API,
  # ни токена, ни предела запросов.
  #
  # Права `contents: write` — минимальные из нужных, и только у этого задания.
  # Перезапуск CI на старом коммите сдвинет указатель назад, и сервер честно
  # откатится на него: это свойство, а не оплошность — выложено ровно то,
  # что последним признали проверенным.
  green:
    name: Отметка «проверено»
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: git push --force origin HEAD:refs/heads/ci-green
