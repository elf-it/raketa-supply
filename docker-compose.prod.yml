# Боевая сборка: база, миграции, бэкенд, интерфейс (задача A-7).
#
#   cp .env.prod.example .env && заполнить SECRET_KEY и пароль базы
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml run --rm backend python -m app.admin почта "Имя"
#
# HTTPS здесь нет намеренно: сертификаты, домен и их продление — дело того,
# кто разворачивает (вопрос Q-16). Перед этим compose ставят свой прокси
# с TLS, и тогда приложению нужен TRUSTED_PROXY_HOPS=2: прокси стало два.
# Без HTTPS COOKIE_SECURE=true не даст войти ниоткуда, кроме localhost.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raketa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан — укажите его в .env}
      POSTGRES_DB: ${POSTGRES_DB:-raketa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-raketa}']
      interval: 5s
      timeout: 5s
      retries: 10
    # Порт наружу не выставлен: база нужна только службам этого compose.

  # Общий кэш расчёта (задача G-14). Поднимается только с профилем `cache`:
  #   docker compose -f docker-compose.prod.yml --profile cache up -d
  # и только вместе с CALC_CACHE_URL=redis://cache:6379/0 в .env. По замерам
  # на 1080 парах он себя не окупает (docs/08-performance.md) — включать стоит,
  # когда воркеров много или каталог заметно больше.
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ['cache']
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    # Ни тома, ни сохранения: это кэш. Потеря содержимого стоит одного
    # пересчёта, а не данных.

  # Миграции — отдельный шаг, а не часть старта приложения: несколько воркеров
  # начали бы мигрировать одновременно. Служба отрабатывает и завершается,
  # бэкенд ждёт именно её успешного завершения.
  migrate:
    build: ./backend
    command: ['alembic', 'upgrade', 'head']
    restart: 'no'
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-raketa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-raketa}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-raketa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-raketa}
      # Вне отладки приложение не стартует с ключом по умолчанию и с кукой
      # по открытому HTTP — обе проверки включает именно DEBUG=false.
      DEBUG: 'false'
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY не задан — сгенерируйте ключ и укажите его в .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      # Перед бэкендом ровно один прокси — nginx из службы web.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # В контейнере логи читают из `docker compose logs`, и собирает их
      # драйвер логов, а не человек: строка-объект удобнее глазастой строки.
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WB_CLIENT: ${WB_CLIENT:-http}
      WB_TOKENS: ${WB_TOKENS:-}
      # Остатки: отчётом (как в документации) или прежним путём — задача E-8.
      WB_STOCKS_SOURCE: ${WB_STOCKS_SOURCE:-report}
      SYNC_STALE_HOURS: ${SYNC_STALE_HOURS:-36}
      # Пусто — кэш расчёта только в памяти процесса. Со службой `cache`:
      # redis://cache:6379/0 (см. профиль `cache` выше и docs/08-performance.md).
      CALC_CACHE_URL: ${CALC_CACHE_URL:-}
      # Доставка алертов (задача G-16). Пусто — система о себе не сообщает.
      # Полунастроенный блок почты — отказ старта, это намеренно: «алерты
      # настроены» вместе с «алерты не уходят» — худший из исходов.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-0}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_CHAT_ID: ${ALERT_WEBHOOK_CHAT_ID:-}
      ALERT_REPEAT_HOURS: ${ALERT_REPEAT_HOURS:-24}
      # Пульс наружу (задача G-18): сторож ждёт сигнала и шумит, когда тот
      # пропал. О собственной смерти система сообщить не может.
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Живость, а не готовность: по этой проверке контейнер перезапускают,
    # и падать из-за неудачной загрузки WB он не должен. Готовность
    # (/api/v1/health/ready) — для внешнего мониторинга, задача G-4.
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      # Адрес привязки отдельно от порта намеренно. Публикация портов в Docker
      # идёт мимо ufw: правило «закрыто всё, кроме 22/80/443» на опубликованный
      # порт не действует, и `0.0.0.0:8080` открыт из интернета, что бы ни
      # говорил фаервол. Когда впереди стоит свой nginx с TLS, порт ему нужен
      # только с самой машины — WEB_BIND=127.0.0.1. Значение по умолчанию
      # оставлено прежним: без прокси иначе нечем открыть сайт.
      - '${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80'
    depends_on:
      - backend

volumes:
  pgdata:
