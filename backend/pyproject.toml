[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Depends() в сигнатуре — идиома FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Тела миграций генерирует Alembic; длина строк в них не предмет для правки.
"alembic/versions/*" = ["E501"]
