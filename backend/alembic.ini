; Alembic configuration.
;
; Kept ASCII-only on purpose: Alembic reads this file with the locale encoding,
; which is cp1251 on a Russian Windows, so Cyrillic comments break the parser.
; The explanations live in alembic/env.py and docs/06-migrations.md.
;
; sqlalchemy.url is deliberately absent: env.py takes it from the application
; settings (DATABASE_URL), so migrations cannot drift to another database.

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
