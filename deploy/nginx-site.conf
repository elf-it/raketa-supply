# Внешний nginx перед compose (задача A-10). Шаблон: install.sh подставляет
# __NAMES__ и __UPSTREAM__ и кладёт результат в /etc/nginx/conf.d/raketa.conf.
#
# Зачем ещё один nginx, если один уже внутри compose: TLS, домен и продление
# сертификата — дело машины, а не образа (вопрос Q-16). Образ интерфейса
# остаётся тем же и в разработке, и на сервере.
#
# Прокси теперь два, поэтому приложению нужен TRUSTED_PROXY_HOPS=2: адрес
# клиента для счётчика попыток входа читается на две позиции левее.

server {
    listen 80;
    listen [::]:80;
    server_name __NAMES__;

    # Проверка владения доменом от Let's Encrypt ходит по открытому HTTP
    # и должна работать до того, как появится сертификат. Поэтому этот путь
    # стоит выше переадресации на HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 именно так: директива `http2 on;` появилась в nginx 1.25,
    # а на машине 1.18.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __NAMES__;

    # Ссылка, а не файл: cert.sh переставляет её с самоподписанного
    # сертификата на настоящий, не правя этот конфиг.
    ssl_certificate /etc/raketa/cert/fullchain.pem;
    ssl_certificate_key /etc/raketa/cert/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:raketa:10m;
    ssl_session_timeout 1d;

    # Пустой, пока сертификат самоподписанный: HSTS запрещает браузеру
    # «пройти всё равно» и закрыл бы сайт насовсем.
    include /etc/raketa/hsts.conf;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Те же пределы, что у внутреннего nginx: иначе загрузка номенклатуры
    # упиралась бы во внешний прокси, а в журнале это выглядело бы ошибкой
    # приложения.
    client_max_body_size 16m;

    location / {
        proxy_pass http://__UPSTREAM__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
