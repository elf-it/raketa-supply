# Отдаёт собранный интерфейс и проксирует /api на бэкенд (задача A-7).
#
# Интерфейс и API живут на одном источнике намеренно: сессионная кука стоит
# с SameSite=Lax, и с другого домена браузер её не отправит. Отдельный домен
# для API потребовал бы и CORS, и защиты от CSRF.

upstream raketa_api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Файлы сборки именованы по содержимому (index-C-T-6PAs.js), поэтому их
    # можно кэшировать надолго; index.html — нельзя, иначе браузер будет
    # открывать старую сборку после обновления.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://raketa_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Адрес клиента для счётчика попыток входа. Прокси здесь ровно один,
        # поэтому приложению ставят TRUSTED_PROXY_HOPS=1: оно прочитает адрес
        # с той позиции, которую заполнил этот заголовок, а приписанное
        # клиентом останется слева и прочитано не будет (задача G-12).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Номер запроса: nginx выдаёт свой, приложение его сохраняет и пишет
        # в каждую строку лога (задача G-4). Иначе один запрос получил бы
        # в двух системах два разных номера.
        proxy_set_header X-Request-Id $request_id;

        # Выгрузки в XLSX собираются на лету и на большом каталоге идут дольше
        # обычного ответа.
        proxy_read_timeout 120s;
        # Загрузка номенклатуры и правок прогноза — файлы на несколько мегабайт.
        client_max_body_size 16m;
    }

    # Маршрутизации на стороне браузера нет: экраны переключаются состоянием,
    # адрес не меняется. Откат на index.html оставлен на случай, когда человек
    # открывает закладку с путём, которого у статики нет.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
